[package]
name = "scrapy"
version = "1.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strsim = "0.11.1"
tokio = { version = "1.52.3", features = ["full"] }
urlencoding = "2.1.3"
futures = "0.3.31"
url = "2.5.0"
base64 = "0.22.1"

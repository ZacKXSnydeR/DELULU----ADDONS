[package]
name = "embegator"
version = "1.2.1"
edition = "2021"
description = "EmbeGator - Add-on stream extractor runtime for Delulu"

[dependencies]
tokio      = { version = "1",    features = ["full"] }
rquest     = { version = "5.1.0", features = ["json", "gzip", "brotli", "stream"], default-features = false }
serde      = { version = "1",    features = ["derive"] }
serde_json = "1"
anyhow     = "1"
chrono     = "0.4"
clap = { version = "4.5.60", features = ["derive"] }
rquest-util = "2.2.1"
urlencoding = "2.1.3"
url = "2.5"
base64 = "0.22"

# Embedded proxy server
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto       = true
strip     = true
